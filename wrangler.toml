# Tiene que coincidir con el nombre del Worker en el dashboard (Workers Builds
# falla si no). Se renombró de "formulario-17" a "presupuesto" el 01/10/2026:
# la URL pasó a ser presupuesto.moron-presupuesto.workers.dev.
name = "presupuesto"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Las variables que no están en [vars] (MAIL_PROVIDER, ...) se cargan en el
# dashboard: sin esto, cada `wrangler deploy` las borraría.
keep_vars = true

# Deploy nativo de Workers (no Pages): el pipeline de "Workers Builds" de
# Cloudflare provisiona un token de build que solo tiene permiso sobre la
# API de Workers, no sobre la de Pages. `dist/_worker.js/index.js` es el
# mismo formato "export default { fetch }" que usan los Workers, así que
# se puede desplegar directo con `wrangler deploy` (comando: `npx wrangler
# deploy`) apuntando `main` a ese archivo y sirviendo el resto de `dist/`
# como assets estáticos. `public/.assetsignore` excluye `_worker.js` y
# `_routes.json` (que Astro regenera en cada build) de subirse como si
# fueran archivos públicos.
# worker/index.mjs envuelve la salida de Astro (dist/_worker.js) y le agrega
# la tarea programada diaria de alertas de vencimientos.
main = "worker/index.mjs"

[assets]
directory = "dist"
binding = "ASSETS"

[vars]
# URL pública: para los enlaces de los mails (baja, F17) que salen desde la
# tarea programada, que no tiene un pedido del que tomar la dirección.
SITE_URL = "https://presupuesto.moron-presupuesto.workers.dev"
# Mails desde la casilla institucional por SMTP (ver src/lib/mail-sender.ts).
# No sale nada hasta que se cargue la contraseña como secret:
#   npx wrangler secret put MAIL_SMTP_PASSWORD --name presupuesto
MAIL_PROVIDER = "smtp"
MAIL_SMTP_HOST = "mail.moron.gob.ar"
MAIL_SMTP_PORT = "465"
MAIL_SMTP_USER = "dir.presupuesto@moron.gob.ar"

# - "0 11 * * *": alertas de vencimientos por mail, una vez al día (11:00 UTC = 8:00 Argentina).
# - el resto: sincronizar con RAFAMOR SQL cada 30 minutos (un mes por corrida;
#   ver src/lib/sync-rafamor-sql.ts y worker/index.mjs).
[triggers]
crons = ["0 11 * * *", "*/30 * * * *"]

# Base creada con `wrangler d1 create f17_db`.
[[d1_databases]]
binding = "DB"
database_name = "f17_db"
database_id = "664ea2d3-98ae-407e-a79b-ec17294970ef"
migrations_dir = "migrations"

# Secrets (no van acá: `npx wrangler secret put <NOMBRE>`, o Cloudflare
# dashboard -> Workers -> formulario-17 -> Settings -> Variables and Secrets):
#   ADMIN_PASSWORD_HASH   -> sha-256 de la contraseña del panel admin
#   SESSION_SECRET        -> clave aleatoria para firmar la cookie de sesión
#   MAIL_SMTP_PASSWORD    -> contraseña de dir.presupuesto@moron.gob.ar (si MAIL_PROVIDER=smtp)
#   MAIL_TOKEN            -> clave compartida con el Apps Script de envío (si MAIL_PROVIDER=apps_script)
#   RESEND_API_KEY        -> si MAIL_PROVIDER=resend
#   RAFAMOR_CF_CLIENT_ID     -> token de servicio de Cloudflare Access para RAFAMOR SQL
#   RAFAMOR_CF_CLIENT_SECRET -> (ver src/lib/sync-rafamor-sql.ts)
# Variables (no secretas), en el mismo lugar:
#   (MAIL_PROVIDER está en [vars]; para cambiar de proveedor: "smtp" | "apps_script" | "resend")
#   MAIL_APPS_SCRIPT_URL  -> URL /exec de scripts/mail_apps_script.gs publicado
#   MAIL_FROM             -> remitente, si MAIL_PROVIDER=resend
